version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "internal/repository/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "text[]"
            go_type: "[]string"
          - db_type: "inet[]"
            go_type: "[]string"
          - db_type: "jsonb"
            go_type:
              type: "json.RawMessage"
              import: "encoding/json"
