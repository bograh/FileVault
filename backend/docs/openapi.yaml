openapi: 3.1.0
info:
  title: FileVault API
  description: Cloud file storage platform API with multi-tenant project management, presigned uploads, webhooks, and billing.
  version: 1.0.0
  contact:
    name: FileVault Support
    url: https://docs.filevault.io
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.filevault.io
    description: Production

tags:
  - name: Auth
    description: Authentication and session management
  - name: Projects
    description: Project CRUD and management
  - name: Uploads
    description: File upload management with presigned URLs
  - name: API Keys
    description: Project API key management
  - name: Webhooks
    description: Webhook endpoint management and delivery
  - name: Billing
    description: Subscription plans, invoices, and checkout
  - name: Dashboard
    description: Aggregated dashboard metrics
  - name: Health
    description: Health check endpoints

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: healthLive
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: healthReady
      responses:
        '200':
          description: Service is ready (DB connected)
        '503':
          description: Service not ready

  /v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: authMe
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate session)
      operationId: authLogout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Logged out

  /v1/projects:
    get:
      tags: [Projects]
      summary: List all projects
      operationId: projectsList
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create a new project
      operationId: projectsCreate
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project by ID
      operationId: projectsGet
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update project
      operationId: projectsUpdate
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Delete project
      operationId: projectsDelete
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/usage:
    get:
      tags: [Projects]
      summary: Get project usage stats
      operationId: projectsUsage
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Usage stats

  /v1/projects/{projectId}/stats:
    get:
      tags: [Projects]
      summary: Get project daily stats
      operationId: projectsStats
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Daily stats array

  /v1/projects/{projectId}/uploads:
    get:
      tags: [Uploads]
      summary: List uploads in a project
      operationId: uploadsList
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
      responses:
        '200':
          description: Paginated uploads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      tags: [Uploads]
      summary: Initiate an upload (returns presigned URL)
      operationId: uploadsCreate
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload initiated with presigned URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/projects/{projectId}/uploads/{uploadId}:
    get:
      tags: [Uploads]
      summary: Get upload details
      operationId: uploadsGet
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Upload details
    delete:
      tags: [Uploads]
      summary: Delete an upload
      operationId: uploadsDelete
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: Deleted

  /v1/projects/{projectId}/uploads/{uploadId}/complete:
    post:
      tags: [Uploads]
      summary: Mark upload as complete (triggers processing)
      operationId: uploadsComplete
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Upload marked for processing

  /v1/projects/{projectId}/uploads/{uploadId}/url:
    get:
      tags: [Uploads]
      summary: Get signed download URL
      operationId: uploadsSignedURL
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      expires_at:
                        type: string
                        format: date-time

  /v1/projects/{projectId}/uploads/batch-delete:
    post:
      tags: [Uploads]
      summary: Batch delete uploads
      operationId: uploadsBatchDelete
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch delete result

  /v1/projects/{projectId}/keys:
    get:
      tags: [API Keys]
      summary: List API keys for a project
      operationId: keysList
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: List of API keys
    post:
      tags: [API Keys]
      summary: Create a new API key
      operationId: keysCreate
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created (plaintext returned once)

  /v1/projects/{projectId}/keys/{keyId}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      operationId: keysRevoke
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Key revoked

  /v1/projects/{projectId}/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: webhooksList
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Webhook endpoints
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      operationId: webhooksCreate
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created

  /v1/projects/{projectId}/webhooks/{webhookId}:
    patch:
      tags: [Webhooks]
      summary: Update a webhook endpoint
      operationId: webhooksUpdate
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Updated webhook
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      operationId: webhooksDelete
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Deleted

  /v1/projects/{projectId}/webhooks/{webhookId}/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook deliveries
      operationId: webhooksDeliveries
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Delivery history

  /v1/projects/{projectId}/webhooks/{webhookId}/test:
    post:
      tags: [Webhooks]
      summary: Send a test webhook delivery
      operationId: webhooksTest
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Test delivery sent

  /v1/billing/plans:
    get:
      tags: [Billing]
      summary: List available subscription plans
      operationId: billingPlans
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Available plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/billing/subscription:
    get:
      tags: [Billing]
      summary: Get current subscription
      operationId: billingSubscription
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Subscription details

  /v1/billing/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      operationId: billingInvoices
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Invoice list

  /v1/billing/checkout:
    post:
      tags: [Billing]
      summary: Create checkout session
      operationId: billingCheckout
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: string
                success_url:
                  type: string
                cancel_url:
                  type: string
      responses:
        '200':
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri

  /v1/billing/portal:
    post:
      tags: [Billing]
      summary: Get customer billing portal URL
      operationId: billingPortal
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Portal URL

  /v1/billing/change-plan:
    post:
      tags: [Billing]
      summary: Change subscription plan
      operationId: billingChangePlan
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: string
                  enum: [hobby, starter, pro, enterprise]
      responses:
        '200':
          description: Updated subscription
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Get dashboard overview metrics
      operationId: dashboardOverview
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Dashboard metrics

  /webhooks/stripe:
    post:
      tags: [Billing]
      summary: Stripe webhook endpoint
      operationId: webhookStripe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature

  /webhooks/paystack:
    post:
      tags: [Billing]
      summary: Paystack webhook endpoint
      operationId: webhookPaystack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer fv_live_... or Bearer fv_test_..."

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. email already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        data:
          type: object
        meta:
          type: object

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            docs_url:
              type: string
              format: uri

    SignupRequest:
      type: object
      required: [name, email, password, country]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        country:
          type: string
          minLength: 2

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        storage_region:
          type: string
          default: us-east-1
        storage_backend:
          type: string
          enum: [s3, gcs, azure]
          default: s3

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string

    CreateUploadRequest:
      type: object
      required: [filename, content_type, size_bytes]
      properties:
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string

    CreateAPIKeyRequest:
      type: object
      required: [name, environment]
      properties:
        name:
          type: string
        environment:
          type: string
          enum: [live, test]
        expires_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - upload.completed
              - upload.failed
              - upload.deleted
              - project.updated
              - project.deleted

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
